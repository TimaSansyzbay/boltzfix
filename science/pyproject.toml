[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boltzfix-science"
version = "0.1.0"
description = "Auditable, budget-bounded protein-ligand pose investigations"
requires-python = ">=3.11,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
 "numpy>=2,<3", "scipy>=1.14,<2", "rdkit>=2024.9", "gemmi>=0.7,<1",
 "posebusters>=0.4,<1", "httpx>=0.28,<1", "python-multipart>=0.0.20",
 "biopython>=1.85,<2", "openmm>=8.2,<9", "mcp>=1.9,<2", "typer>=0.15,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
boltzfix = "boltzfix.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["boltzfix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
